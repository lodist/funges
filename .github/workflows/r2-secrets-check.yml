name: R2 secrets check (temporary)

on:
  push:
    branches: [chore/private-data]
    paths: [.github/workflows/r2-secrets-check.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install boto3 pyarrow
      - name: Read a private file
        run: python -c "import sys; sys.path.insert(0, 'backend'); import r2; print(len(r2.fetch('https://data.fung.es/EU/NE/NE_species_params.txt')), 'bytes')"
      - name: Read today's scores (what update-data runs)
        run: |
          python backend/r2.py scores/foraging_scores.parquet scores.parquet
          python -c "import pyarrow.parquet as pq; t = pq.read_table('scores.parquet'); print(t.num_rows, 'rows, up to', max(t.column('Date').to_pylist()))"
      - name: Writing is refused (read-only key)
        run: |
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, 'backend')
          import r2
          from botocore.exceptions import ClientError
          try:
              r2.client().put_object(Bucket=os.environ['R2_BUCKET_NAME'], Key='ci-write-test', Body=b'x')
          except ClientError as e:
              print('refused as expected:', e.response['Error']['Code'])
          else:
              sys.exit('the CI key can WRITE to the bucket')
          EOF
