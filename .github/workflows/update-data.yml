name: Update site data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FUNGES_BOT_APP_ID }}
          private-key: ${{ secrets.FUNGES_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: main

      - name: Sync to latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow shapely

      - name: Run visitor script
        run: python scripts/fetch_visitors.py

      - name: Generate scores metadata (max date)
        run: python scripts/generate_scores_metadata.py

      - name: Generate data nerd JSON
        run: python scripts/generate_data.py

      - name: Generate worth foraging now JSON
        run: python scripts/generate_worth_foraging_now.py

      - name: Show changes
        run: |
          git status --porcelain
          echo "--- visitors.json ---" && [ -f public/data/visitors.json ] && cat public/data/visitors.json || echo "missing"
          echo "--- scores_metadata.json ---" && [ -f public/data/scores_metadata.json ] && cat public/data/scores_metadata.json || echo "missing"
          echo "--- CSV.gz head ---" && gzip -cd public/data/foraging_scores.csv.gz | head -3 || true

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update site data'
          file_pattern: public/data/visitors.json public/data/scores_metadata.json public/data/data_nerd.json public/data/worth_foraging_now.json
          commit_user_name: funges-bot
          commit_user_email: funges-bot@users.noreply.github.com
        env:
          GIT_AUTH_TOKEN: ${{ steps.app-token.outputs.token }}
