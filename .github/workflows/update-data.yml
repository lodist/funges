name: Update site data

on:
  workflow_dispatch:
  # Refresh the "updated" label as soon as the nightly scores upload lands
  # (Upload_Scores sends this event); the cron alone fires only every ~9 h.
  repository_dispatch:
    types: [scores-uploaded]
  schedule:
    # Off the hour: GitHub delays and drops scheduled runs most at :00.
    - cron: '23 */3 * * *'
    # The label dates from the LAST region's forecast tiles: the map job ends by
    # ~05:00 UTC on a normal night, hours after the scores upload above.
    - cron: '15 5 * * *'

permissions:
  contents: write

# The scores upload and a late cron can start runs a minute apart: both checked
# out the same main, so the second push was rejected. One at a time instead.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      # Read-only R2 credentials: the masters and scores are private.
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FUNGES_BOT_APP_ID }}
          private-key: ${{ secrets.FUNGES_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: main

      - name: Sync to latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow shapely pmtiles mapbox-vector-tile boto3

      - name: Run visitor script
        run: python scripts/fetch_visitors.py

      - name: Fetch today's scores from R2
        run: python backend/r2.py scores/foraging_scores.parquet public/data/foraging_scores.parquet

      - name: Generate scores metadata (forecast tiles' upload time)
        run: python scripts/generate_scores_metadata.py

      - name: Generate data nerd JSON
        run: python scripts/generate_data.py

      - name: Generate worth foraging now JSON
        run: python scripts/generate_worth_foraging_now.py

      - name: Generate Huerta's live line JSON
        # A failed read keeps the last line; it must not hold back Terra's data.
        continue-on-error: true
        run: python scripts/generate_huerta_now.py

      - name: Refresh offline forecast package metadata
        run: python scripts/refresh_offline_manifest.py

      - name: Show changes
        run: |
          git status --porcelain
          echo "--- visitors.json ---" && [ -f public/data/visitors.json ] && cat public/data/visitors.json || echo "missing"
          echo "--- scores_metadata.json ---" && [ -f public/data/scores_metadata.json ] && cat public/data/scores_metadata.json || echo "missing"
          echo "--- CSV.gz head ---" && gzip -cd public/data/foraging_scores.csv.gz | head -3 || true

      # A PR merged during the ~12 min run moves main, and the push is rejected.
      - name: Catch up with main
        # --autostash makes a stash commit, which needs an identity.
        run: >-
          git -c user.name='funges-bot[bot]'
          -c user.email='228909006+funges-bot[bot]@users.noreply.github.com'
          pull --rebase --autostash origin main

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update site data'
          file_pattern: public/data/visitors.json public/data/scores_metadata.json public/data/data_nerd.json public/data/worth_foraging_now.json public/data/huerta_now.json public/offline-packages.json
          # Without commit_author the action credits github.actor, which on a
          # scheduled run is whoever last touched the cron.
          commit_user_name: funges-bot[bot]
          commit_user_email: 228909006+funges-bot[bot]@users.noreply.github.com
          commit_author: funges-bot[bot] <228909006+funges-bot[bot]@users.noreply.github.com>
        env:
          GIT_AUTH_TOKEN: ${{ steps.app-token.outputs.token }}
