name: Update site data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write   # needed to push commits

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

    steps:
      # 1) Get an installation token from your GitHub App
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FUNGES_BOT_APP_ID }}
          private-key: ${{ secrets.FUNGES_BOT_PRIVATE_KEY }}

      # 2) Checkout using the App token (critical)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # 3) Python setup + deps
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4) Your scripts
      - name: Run visitor script
        run: python scripts/fetch_visitors.py

      - name: Generate scores metadata
        run: python scripts/generate_scores_metadata.py

      # 5) Commit & push with the App token
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update site data"
          file_pattern: public/data/visitors.json public/data/scores_metadata.json
          commit_user_name: funges-bot
          commit_user_email: funges-bot@users.noreply.github.com
        env:
          GIT_AUTH_TOKEN: ${{ steps.app-token.outputs.token }}
