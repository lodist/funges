name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}
      VITE_HOSTNAME: ${{ vars.VITE_HOSTNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate environment variables and secrets
        run: |
          echo "🔍 Validating environment variables and secrets..."

          # Check if required environment variables are defined
          if [ -z "$VITE_BASE_URL" ]; then
            echo "❌ ERROR: VITE_BASE_URL is not defined"
            echo "   Please set VITE_BASE_URL in your repository variables"
            exit 1
          fi

          if [ -z "$VITE_HOSTNAME" ]; then
            echo "❌ ERROR: VITE_HOSTNAME is not defined"
            echo "   Please set VITE_HOSTNAME in your repository variables"
            exit 1
          fi

          echo "✅ All required environment variables are defined"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npx vitest run --project unit

      - name: Create .env file
        run: |
          echo "📝 Creating .env file..."
          cat > .env << EOF
          VITE_BASE_URL=$VITE_BASE_URL
          VITE_HOSTNAME=$VITE_HOSTNAME
          EOF
          echo "✅ .env file created successfully"

      - name: Export environment variables
        run: |
          echo "🔧 Exporting environment variables..."
          export VITE_BASE_URL="$VITE_BASE_URL"
          export VITE_HOSTNAME="$VITE_HOSTNAME"

      - name: Debug .env file
        run: |
          echo "🔍 Verifying .env file..."
          if [ -f .env ]; then
            echo "✅ .env file exists"
            echo "📄 .env file size: $(wc -l < .env) lines"
            echo "🔒 .env file permissions: $(ls -la .env)"
          else
            echo "❌ .env file not found!"
            exit 1
          fi

      - name: Build project
        run: |
          echo "🏗️ Starting build process..."
          npm run build

          echo "✅ Build completed successfully"

      - name: Create SPA route directories for GitHub Pages
        run: |
          echo "Creating route subdirectories so GitHub Pages serves them with HTTP 200..."
          routes=(data impressum instructions offline privacy-policy recipes settings species support termsuse worth-foraging-now)
          for route in "${routes[@]}"; do
            mkdir -p dist/$route
            cp dist/index.html dist/$route/index.html
            echo "  created dist/$route/index.html"
          done
          echo "Route directories created"

      - name: Verify static files in dist
        run: |
          echo "🔍 Verifying static files (sitemap.xml, robots.txt, 404.html)..."

          MISSING_FILES=""

          # Check sitemap.xml
          if [ -f dist/sitemap.xml ]; then
            echo "✅ sitemap.xml found in dist/"
            echo "📄 sitemap.xml size: $(wc -c < dist/sitemap.xml) bytes"
            echo "📄 First 5 lines of sitemap.xml:"
            head -5 dist/sitemap.xml
          else
            echo "❌ sitemap.xml NOT found in dist/"
            MISSING_FILES="$MISSING_FILES sitemap.xml"
          fi

          echo ""

          # Check robots.txt
          if [ -f dist/robots.txt ]; then
            echo "✅ robots.txt found in dist/"
            echo "📄 robots.txt contents:"
            cat dist/robots.txt
          else
            echo "⚠️  robots.txt NOT found in dist/ (optional)"
          fi

          echo ""

          # Check 404.html
          if [ -f dist/404.html ]; then
            echo "✅ 404.html found in dist/"
            echo "📄 404.html size: $(wc -c < dist/404.html) bytes"
          else
            echo "❌ 404.html NOT found in dist/"
            MISSING_FILES="$MISSING_FILES 404.html"
          fi

          # Check .nojekyll
          if [ -f dist/.nojekyll ]; then
            echo "✅ .nojekyll found in dist/"
          else
            echo "⚠️  .nojekyll NOT found in dist/ (recommended for GitHub Pages)"
          fi

          # Fail if critical files are missing
          if [ -n "$MISSING_FILES" ]; then
            echo ""
            echo "❌ CRITICAL: Missing files:$MISSING_FILES"
            echo "💡 sitemap.xml is generated by vite-plugin-sitemap at build time."
            echo "💡 Make sure this file is in your public/ directory:"
            echo "   - public/404.html"
            echo "   - public/.nojekyll (optional but recommended)"
            echo ""
            echo "📁 Current public/ directory contents:"
            ls -la public/ || echo "public/ directory not found!"
            exit 1
          fi

          echo ""
          echo "✅ All required static files are present!"

      - name: Debug build output
        run: |
          echo "🔍 Analyzing build output..."
          echo "📁 Build directory contents:"
          ls -la dist/

          echo "📄 index.html contents (first 10 lines):"
          head -10 dist/index.html

          echo "📄 index.html contents (last 10 lines):"
          tail -10 dist/index.html

          echo "🔍 Checking for base URL in built files:"
          # Extract the base path from VITE_BASE_URL (remove protocol and domain if present)
          BASE_PATH=$(echo "$VITE_BASE_URL" | sed 's|^https\?://[^/]*||' | sed 's|/$||')
          if [ -z "$BASE_PATH" ]; then
            BASE_PATH="/"
          fi

          echo "🔍 Looking for base path: $BASE_PATH"

          if grep -q "$BASE_PATH" dist/index.html; then
            echo "✅ Base path $BASE_PATH found in built files"
          else
            echo "❌ Base path $BASE_PATH NOT found in built files"
            echo "🔍 Searching for absolute paths:"
            grep -o 'src="/[^"]*"' dist/index.html || echo "No absolute src paths found"
            grep -o 'href="/[^"]*"' dist/index.html || echo "No absolute href paths found"
          fi

          echo "📊 Build output size:"
          du -sh dist/
          echo "📊 Assets directory size:"
          du -sh dist/assets/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "🚀 Deployment completed!"
          echo "📅 Deployment time: $(date)"

          # Extract the base path from VITE_BASE_URL for the deployment URL
          BASE_PATH=$(echo "${{ vars.VITE_BASE_URL }}" | sed 's|^https\?://[^/]*||' | sed 's|/$||')
          if [ -z "$BASE_PATH" ] || [ "$BASE_PATH" = "/" ]; then
            DEPLOY_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          else
            DEPLOY_URL="https://${{ github.repository_owner }}.github.io$BASE_PATH/"
          fi

          echo "🔗 Site URL: $DEPLOY_URL"
          echo "📊 Deployment status: ${{ steps.deployment.outcome }}"

          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "✅ Deployment successful!"
            echo "🌐 Your site should be available at: $DEPLOY_URL"
            echo "📄 Sitemap should be at: ${DEPLOY_URL}sitemap.xml"
            echo "🤖 Robots.txt should be at: ${DEPLOY_URL}robots.txt"
          else
            echo "❌ Deployment failed!"
            echo "🔍 Check the deployment logs above for errors"
          fi
