name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-check:
    # Skip draft PRs — checks run once the PR is marked ready for review
    # (or immediately, for a PR opened directly as non-draft).
    if: github.event.pull_request.draft == false
    # Playwright 1.60 does not support ubuntu-26.04 (now ubuntu-latest); unpin once it does.
    runs-on: ubuntu-24.04
    env:
      VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}
      VITE_HOSTNAME: ${{ vars.VITE_HOSTNAME }}
      # A PR from a fork gets no secrets: species:check then skips the scoring file.
      HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: '3.53.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Keyed on package-lock.json so a rerun after a rebase (forced by the
      # branch's "must be up to date" required-check policy) can skip a
      # full reinstall when the lockfile hasn't changed.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # The species' scoring parameters are private (on R2, not in git), so
      # species:check can only validate them once this step fetches them with
      # the read-only key. The key stays in this step.
      - name: Setup Python
        if: env.HAS_R2 == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch the scoring parameters
        if: env.HAS_R2 == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python -m pip install boto3
          python backend/r2.py sync species_scoring.json

      # Runs the same checks as the deploy workflow's build job:
      # format check, lint, type check, unit tests, build.
      # See the Taskfile's `ci-check-only` task for the exact steps.
      - name: Run CI checks
        run: task ci-check-only
