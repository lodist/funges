<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Funges - Loading...</title>
    <script>
      // SPA routing fallback for GitHub Pages.
      // Valid routes are served directly via their own index.html (e.g. /species/index.html),
      // so this only fires for truly non-existent paths.
      (function () {
        const path = window.location.pathname;

        // Skip redirect for static files — let GitHub Pages return a real 404.
        if (
          path.endsWith('.xml') ||
          path.endsWith('.txt') ||
          path.endsWith('.json')
        ) {
          return;
        }

        const segments = path.split('/').filter(Boolean);
        // Root domain (base = /): redirect to /.
        // Subdirectory deployment (base = /repo/): redirect to /repo/.
        const base = segments.length > 1 ? '/' + segments[0] + '/' : '/';
        window.location.replace(base);
      })();
    </script>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #3d7e40 0%, #16a34a 100%);
        color: white;
      }
      .container {
        text-align: center;
        padding: 2rem;
      }
      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 4px solid white;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner"></div>
      <h1>Loading Funges...</h1>
      <p>Redirecting to your foraging adventure...</p>
    </div>
  </body>
</html>
