<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Funges - Loading...</title>
    <script>
      // SPA routing fix for GitHub Pages
      (function () {
        const path = window.location.pathname;

        // Skip redirect for static files
        if (
          path.endsWith('.xml') ||
          path.endsWith('.txt') ||
          path.endsWith('.json') ||
          path === '/sitemap.xml' ||
          path === '/robots.txt'
        ) {
          console.info('📄 Static file requested, no redirect');
          return; // Let GitHub Pages handle it as a real 404
        }

        // Get the base path from the current URL
        const segments = path.split('/').filter(Boolean);

        if (segments.length === 0) {
          // Root domain deployment (VITE_BASE_URL=/)
          console.info('🔄 Root domain deployment, reloading...');
          window.location.reload();
        } else if (segments.length === 1) {
          // Subdirectory deployment (VITE_BASE_URL=/funges/)
          const basePath = '/' + segments[0] + '/';
          console.info('🔄 Subdirectory deployment, redirecting to:', basePath);
          window.location.href = basePath;
        } else {
          // Deep route in subdirectory (e.g., /funges/recipes)
          const basePath = '/' + segments[0] + '/';
          console.info('🔄 Deep route, redirecting to base:', basePath);
          window.location.href = basePath;
        }
      })();
    </script>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #3d7e40 0%, #16a34a 100%);
        color: white;
      }
      .container {
        text-align: center;
        padding: 2rem;
      }
      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 4px solid white;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner"></div>
      <h1>Loading Funges...</h1>
      <p>Redirecting to your foraging adventure...</p>
    </div>
  </body>
</html>
