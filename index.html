    <!-- Map data + glyph origins: DNS/TLS handshake overlaps the JS download -->
    <link rel="preconnect" href="https://data.fung.es" crossorigin />
    <link rel="preconnect" href="https://protomaps.github.io" crossorigin />

    <!-- Moving into or out of /identify loads a new page (src/lib/isolation.ts).
         The page being left stays on screen, blurred, until the new one has
         drawn; the script below ends the transition. The 3 s hold is the
         ceiling if the app never draws. The browser captures the new page at
         its first frame, which on a slow CPU comes mid-parse: the script sits
         in <head>, and rel=expect holds that frame until #page-wait exists.
         ponytail: hides the new page of every view transition; scope it with
         `types` if the app ever calls document.startViewTransition. -->
    <link rel="expect" href="#page-wait" blocking="render" />
    <style>
      @view-transition {
        navigation: auto;
      }
      /* A static blur, not an animated one: Chrome steps a filter animation on
         the main thread, which the new page's JavaScript keeps busy on a slow
         CPU, so the blur never showed. The veil's fade-in still softens it. */
      ::view-transition-old(root) {
        animation: none;
        filter: blur(6px);
      }
      ::view-transition-new(root) {
        animation: vt-hold 3s;
      }
      @keyframes vt-hold {
        from,
        to {
          opacity: 0;
        }
      }
      /* An in-app page change shows the squirrel, a launch the splash. */
      #page-wait,
      .page-change #app-splash {
        display: none !important;
      }
      .page-change #page-wait {
        display: block !important;
      }
    </style>
    <!-- data-cfasync="false": Cloudflare's Rocket Loader otherwise defers this
         script until after the page has loaded, long past the first frame it
         exists for (DEPLOYMENT.md). -->
    <script data-cfasync="false">
      // The theme class theme-provider.tsx sets once React runs, set now so the
      // veil and the first frame already match it.
      try {
        var theme = localStorage.getItem('vite-ui-theme') || 'system';
        var dark =
          theme === 'dark' ||
          (theme === 'system' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch (e) {}
      // A load into or out of /identify (an in-app link, or the route guard's
      // replace) comes from this site: a page change, not a launch.
      if (document.referrer.indexOf(location.origin + '/') === 0) {
        document.documentElement.classList.add('page-change');
      }
      // Once React has drawn something, drop the squirrel and end the view
      // transition in the same frame. A page React drew before the first frame
      // (or restored from the back/forward cache) ends it at reveal.
      var transition = null;
      function drawn() {
        var root = document.getElementById('root');
        return !!(root && root.firstChild);
      }
      function done() {
        var pageWait = document.getElementById('page-wait');
        if (pageWait) pageWait.remove();
        if (transition) transition.skipTransition();
      }
      addEventListener('pagereveal', function (e) {
        transition = e.viewTransition;
        if (drawn()) done();
      });
      (function poll() {
        if (drawn()) done();
        else requestAnimationFrame(poll);
      })();
    </script>
  </head>
  <body>
    <!-- Inline overlay: the app's first paint waits on the CSS + JS, so until
         React mounts the page would be blank. Keeping this outside #root lets
         React initialize the app underneath it during the minimum display time. -->
    <div
      id="app-splash"
      style="
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #f8f5f0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      "
    >
      <img
        src="/icons/logo_funges.png"
        alt="Funges"
        width="1200"
        height="504"
        style="
          display: block;
          width: min(80vw, 320px);
          height: auto;
          object-fit: contain;
        "
      />
    </div>
    <!-- The map's loading overlay (squirrel on an 80% veil), over the blurred
         page during an in-app page change. Its own view-transition-name keeps
         it live (animating) above the old page's still snapshot. -->
    <div
      id="page-wait"
      style="
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: color-mix(
          in oklch,
          var(--background, #f8f5f0) 80%,
          transparent
        );
        view-transition-name: page-wait;
      "
    >
      <img
        src="/src/assets/images/loading_squirrel.gif"
        alt=""
        style="
          position: absolute;
          inset: 0;
          width: 13.4rem;
          height: 13.4rem;
          margin: auto;
        "
      />
    </div>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
